name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node is ">=20"; test the floor and the current LTS.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level moderate

      - name: Typecheck
        run: npm run typecheck

      - name: File-size gate (800-line limit, AGENTS.md)
        run: node scripts/check-file-sizes.mjs

      - name: Docs-sync gate (every USAGE flag documented in the reference)
        run: npm run check:docs

      - name: Test (with coverage thresholds)
        run: npm run coverage

      - name: CLI argument coverage gate
        run: >-
          npx vitest run src/cli/args.test.ts src/cli/args.goaly-code.test.ts --coverage
          --coverage.include=src/cli/args.ts
          --coverage.exclude='src/**/*.test.ts'
          --coverage.thresholds.lines=80
          --coverage.thresholds.functions=80
          --coverage.thresholds.branches=80
          --coverage.thresholds.statements=80

      - name: Build
        run: npm run build

  macos-worktree:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test worktree management on macOS
        run: npx vitest run src/workspace/worktree-manager.test.ts src/cli/worktree-cmd.test.ts
